# Rebuilds the published site on the gh-pages branch: downloads any Checker Framework or
# Annotation File Utilities release that is not on the site yet, regenerates the pages from
# the templates in src/main/resources, publishes the nightly build of master as the development
# version in cf/dev/ and afu/dev/, copies the site's hand-written pages (index.md, 404.html),
# robots.txt, and _config.yml from master, and pushes the result.
#
# It runs daily on a schedule (checking if new releases or a new nightly build exist before
# checking out gh-pages),
# on a push to master that changes one of the hand-written pages, or manually from the
# Actions tab. Manual runs default to a dry run.

name: Publish website

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: '0 6 * * *'
  push:
    branches: [master]
    paths: [index.md, 404.html, robots.txt, _config.yml]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Generate and report, but do not push"
        type: boolean
        default: true

permissions:
  contents: write

# Runs push to gh-pages, so they must not overlap.
concurrency:
  group: publish-website
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      dry_run: ${{ steps.check.outputs.dry_run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=${{ inputs.dry_run }}" >> "$GITHUB_OUTPUT"
            echo "Manual run requested (dry_run=${{ inputs.dry_run }})."
            exit 0
          fi
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "A hand-written page changed on master."
            exit 0
          fi

          # Scheduled run: check if latest releases are already published on the site.  The nightly
          # build is a prerelease, which is not a release.
          RELEASES='[.[] | select((.prerelease or .draft) | not)]'
          CF_TAG=$(gh api repos/eisop/checker-framework/releases --jq "$RELEASES | .[0].tag_name")
          # The Annotation File Utilities zip is an asset of the Checker Framework release.
          # Older releases are in the former annotation-tools repository.
          AFU_ZIP=$(gh api repos/eisop/checker-framework/releases --jq "$RELEASES"' | [.[].assets[] | select(.name | startswith("annotation-file-utilities-"))] | .[0].name')
          if [ -z "$AFU_ZIP" ] || [ "$AFU_ZIP" = "null" ]; then
            AFU_ZIP=$(gh api repos/eisop/annotation-tools/releases --jq '.[0].assets[0].name')
          fi

          CF_STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://eisop.github.io/cf/${CF_TAG}/index.html")
          AFU_STATUS=$(curl -s -o /dev/null -w '%{http_code}' "https://eisop.github.io/afu/${AFU_ZIP}")

          echo "Latest CF release: $CF_TAG (HTTP $CF_STATUS on site)"
          echo "Latest AFU release: $AFU_ZIP (HTTP $AFU_STATUS on site)"

          # The generator writes the time of the nightly build it published to cf/dev/build.txt.
          # gh prints the error response on stdout when there is no nightly build.
          NIGHTLY=$(gh api repos/eisop/checker-framework/releases/tags/nightly \
            --jq '[.assets[] | select(.name | startswith("checker-framework-"))] | .[0].updated_at // ""' \
            2> /dev/null) || NIGHTLY=""
          DEV=$(curl -sf "https://eisop.github.io/cf/dev/build.txt" || true)
          echo "Nightly build: ${NIGHTLY:-none} (on site: ${DEV:-none})"

          if [ "$CF_STATUS" != "200" ] || [ "$AFU_STATUS" != "200" ] \
              || { [ -n "$NIGHTLY" ] && [ "$NIGHTLY" != "$DEV" ]; }; then
            echo "New release or nightly build detected that is not yet on the site. Triggering publish."
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "Site is already up to date with latest releases. Skipping checkout and publish."
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check out master, which holds the generator and the templates
        uses: actions/checkout@v7
        with:
          ref: master
          path: generator

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: 'zulu'
          cache: maven

      - name: Build the generator
        run: mvn -B -q package --file generator/pom.xml

      - name: Check out gh-pages, the published site
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
          # The site carries every past release, so fetch only the current tree.
          fetch-depth: 1

      - name: Generate the site
        working-directory: site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          java -cp ../generator/target/eisop.github.io-1.0-SNAPSHOT-jar-with-dependencies.jar \
            io.github.eisop.website.EisopSiteGenerator

      - name: Drop template copies that predate them being packaged in the jar
        working-directory: site
        run: |
          for stale in cf-template.md afu-template.md; do
            if [ -e "$stale" ]; then
              git rm -q "$stale"
              echo "Removed stale $stale; the generator reads its own packaged copy."
            fi
          done

      - name: Copy the hand-written site pages and configuration from master
        # The generator writes only afu/ and cf/; these files are edited on master.
        run: cp generator/index.md generator/404.html generator/robots.txt generator/_config.yml site/

      - name: Stage changes
        working-directory: site
        run: git add -A afu cf index.md 404.html robots.txt _config.yml

      - name: Summarize the changes
        working-directory: site
        run: |
          {
            echo "### Site changes"
            echo
            echo '```'
            git status --short | head -60
            echo '```'
            echo
            git diff --cached --shortstat
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push
        if: ${{ needs.check.outputs.dry_run != 'true' }}
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Nothing to publish; the site is already up to date."
            exit 0
          fi
          git commit -q -m "Regenerate the website"
          git push origin gh-pages
